name: 이미지 태그 손으로 정리

# ★왜 따로 두나 — 배포에 붙은 정리 단계는 「최근 10개」로 고정이라
#   ★실제로 지워지는지 시험할 방법이 없다. 이 워크플로로 남길 개수를 정해
#   돌려 보면, 삭제 권한이 있는지·정말 지워지는지 눈으로 확인할 수 있다.
#
#   ★DRY_RUN 을 켜면 지우지 않고 무엇을 지울지만 보여 준다. 먼저 그걸로 본다.

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "남길 태그 개수 (최근순)"
        required: true
        default: "10"
      dry_run:
        description: "시험만 하고 실제로 지우지 않기"
        type: boolean
        required: true
        default: true

env:
  REGISTRY: kc-sfacspace05.kr-central-2.kcr.dev
  IMAGE_PATH: catchap-captcha-repo/catchap-captcha

jobs:
  prune:
    name: 오래된 태그 정리
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 정리 실행
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          KEEP_TAGS: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 .github/scripts/prune_tags.py
