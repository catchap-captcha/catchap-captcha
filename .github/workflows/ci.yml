name: CI

# 배포 전 회귀 게이트 — push/PR 마다 tests/ 를 전부 돌린다.
#
# ★이 저장소에는 CI 가 없었다 (2026-08-07 발견). 시험 파일 3개가 아무도 안 돌리는
#   상태였고, PR 을 올려도 통과하는지 알 수 없었다.
#
# ★외부 의존이 없다 — 시험은 순수 함수와 스키마 검증이라 DB·네트워크가 필요 없다.
#   실측: 36 passed in 0.37s
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          # ★requirements.txt 가 아니라 requirements-ci.txt 다 — 이유는 그 파일 주석에 있다
          pip install -r requirements-ci.txt

      - name: 시험
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
        # ★tests/ 로 좁힌다. scripts/smoke_test.py 는 손으로 돌리는 스크립트인데
        #   settings.app_port 를 참조하고 그 설정이 ★어느 가지에도 없어 import 부터 죽는다.
        #   (처음 추가될 때부터 깨져 있었다 — 7fa97af)
        #   여기서 같이 돌리면 시험과 무관한 이유로 빨간불이 된다. ⬜별도로 고칠 것.
        run: pytest tests/ -q
